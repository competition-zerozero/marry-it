# Only loaded when SPRING_PROFILES_ACTIVE=docker (see Dockerfile / docker-compose.yml).
# Unlike the base application.properties, these have no empty default: a container
# started without real Google OAuth credentials should fail fast instead of booting
# with a broken login.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile