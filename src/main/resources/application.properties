spring.application.name=marry-it
spring.profiles.default=local
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
# Trust X-Forwarded-* from the reverse proxy in front of this app (nginx locally,
# an AWS load balancer in production) so redirect URLs (e.g. Google OAuth) use the
# correct scheme/host instead of the container-internal http://backend:8080.
server.forward-headers-strategy=framework

kakao.place.base-url=https://dapi.kakao.com
kakao.place.api-key=${KAKAO_REST_API_KEY:}

# AI Agent (OpenAI function calling)
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# MySQL datasource (real values go in application-local.properties, not here)
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
